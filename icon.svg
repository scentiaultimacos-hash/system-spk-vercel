<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Perfume Bottle Silhouette -->
    <!-- Cap -->
    <rect x="226" y="100" width="60" height="40" rx="8" />
    <!-- Neck / Spray -->
    <rect x="238" y="140" width="36" height="20" rx="4" fill="#e2ece6" />
    <!-- Shoulder & Bottle Body -->
    <path d="M160 200 C160 170, 190 160, 230 160 L282 160 C322 160, 352 170, 352 200 L352 380 C352 410, 322 420, 282 420 L230 420 C190 420, 160 410, 160 380 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Label inside bottle -->
    <rect x="186" y="240" width="140" height="120" rx="16" fill="#064e3b" opacity="0.9"/>
    <!-- Monogram SU inside label -->
    <text x="256" y="315" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="2">SU</text>
    <text x="256" y="345" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">SCENTIA</text>
  </g>
</svg>
